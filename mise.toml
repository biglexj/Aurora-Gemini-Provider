# Tareas de Aurora Gemini Provider mediante Mise.
# Estándar común: Docs/global/architecture/mise-command-standard.md
# El proveedor es una utilidad local sin canal de publicación: no expone
# `release` ni `publish`. Esas tareas se declaran solo para responder con un
# error explícito y evitar que la configuración global de Mise las interprete
# con su implementación genérica.
# Todas las tareas apuntan al mismo despachador; `mise <tarea> --plan` no ejecuta acciones.

[tasks.dev]
raw_args = true
description = "Iniciar el servidor local del proveedor en 127.0.0.1:54800"
file = "scripts/mise-task.ts"

[tasks.build]
raw_args = true
description = "Comprobar la sintaxis de todos los scripts y la resolución de dependencias, sin empaquetar"
file = "scripts/mise-task.ts"

[tasks.check]
raw_args = true
description = "Verificar entorno y configuración local (Node, sharp, binario agy/gemini, orígenes permitidos)"
file = "scripts/mise-task.ts"

[tasks.test]
raw_args = true
description = "Ejecutar las pruebas unitarias de los módulos puros"
file = "scripts/mise-task.ts"

[tasks.release]
raw_args = true
description = "No disponible: el proveedor es una utilidad local sin distribución propia"
file = "scripts/mise-task.ts"

[tasks.publish]
raw_args = true
description = "No disponible: el proveedor no tiene canal de publicación"
file = "scripts/mise-task.ts"
